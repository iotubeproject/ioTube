# The witness image version is WITNESS_TAG in .env, a release such as 7.2.0.
# Upgrade or roll back by changing it and running ./upgrade.sh.
#
# Required .env values (copy .env.template -> .env next to this file, then fill in):
#   IOTEX_WITNESS    - absolute path to the witness deploy dir (holds etc/ and data/)
#   DB_ROOT_PASSWORD - MySQL root password for the local witness-db
#   WITNESS_TAG      - witness image version, e.g. 7.2.0 (not latest)
# If one is unset, docker compose fails fast with a clear message (the ${VAR:?...}
# guards below) instead of silently mounting empty directories over the config files.

services:
  database:
    container_name: witness-db
    # WITNESS_DB_IMAGE: mysql:8 (default) or mariadb:11.4 (smaller). Choose it at
    # first setup; an existing data dir must stay with the engine that created it.
    image: ${WITNESS_DB_IMAGE:-mysql:8}
    restart: always
    # Loopback only: the witnesses use host networking and reach MySQL on
    # 127.0.0.1. A writable witness DB must not be reachable from outside.
    ports:
      - 127.0.0.1:13306:3306
    volumes:
      - "${IOTEX_WITNESS:?IOTEX_WITNESS is unset - copy .env.template to .env and set it (see witness-service/README.md)}/data/mysql:/var/lib/mysql:rw"
    environment:
       MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is unset - copy .env.template to .env and set it (see witness-service/README.md)}"

  iotex-payload-witness:
    container_name: iotex-payload-witness
    image: ghcr.io/iotubeproject/iotube-witness:${WITNESS_TAG:?WITNESS_TAG is unset - set it in .env to a release such as 7.2.0}
    restart: on-failure
    volumes:
      - $IOTEX_WITNESS/etc/witness-config-iotex-payload.yaml:/etc/iotube-witness/witness-config-iotex-payload.yaml:ro
      - $IOTEX_WITNESS/etc/witness-config-iotex.secret.yaml:/etc/iotube-witness/witness-config-iotex.secret.yaml:ro
    network_mode: host
    command: witness -config=/etc/iotube-witness/witness-config-iotex-payload.yaml -secret=/etc/iotube-witness/witness-config-iotex.secret.yaml
    environment:
      WITNESS_PRIVATE_KEY: ${WITNESS_PRIVATE_KEY:-}
      RELAYER_URL: ${RELAYER_URL:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

