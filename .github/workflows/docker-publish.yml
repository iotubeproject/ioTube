name: Build and Publish Witness and Relayer Images

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: iotubeproject/iotube-witness


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # tags, for git describe

      - name: Build version
        id: version
        run: |
          # a tag build reports its tag (git describe may pick another tag on
          # the same commit); branch and PR builds report git describe
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # only tags on master are releases
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
              echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on master; not publishing" >&2
              exit 1
            fi
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --dirty --always)"
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+_-]*) echo "unexpected version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: ./witness-service
          file: ./witness-service/Dockerfile.witness
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            GIT_STATUS=clean
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Separate job so the witness image (which others depend on) is never disturbed.
  # Same module, different entrypoint (Dockerfile.relayer builds cmd/relayer); own
  # cache scope so it doesn't collide with the witness build.
  build-relayer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # tags, for git describe

      - name: Build version
        id: version
        run: |
          # a tag build reports its tag (git describe may pick another tag on
          # the same commit); branch and PR builds report git describe
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # only tags on master are releases
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
              echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on master; not publishing" >&2
              exit 1
            fi
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --dirty --always)"
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+_-]*) echo "unexpected version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/iotubeproject/iotube-relayer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: ./witness-service
          file: ./witness-service/Dockerfile.relayer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            GIT_STATUS=clean
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha,scope=relayer
          cache-to: type=gha,mode=max,scope=relayer
